          node-version: '22'
      - name: Create HS Warpora environment file
        working-directory: Hswarpora
        env:
          VITE_APP_FIREBASE_apiKey: ${{ secrets.VITE_APP_FIREBASE_APIKEY }}
          VITE_APP_FIREBASE_appId: ${{ secrets.VITE_APP_FIREBASE_APPID }}
          VITE_APP_FIREBASE_authDomain: ${{ secrets.VITE_APP_FIREBASE_AUTHDOMAIN }}
          VITE_APP_FIREBASE_databaseURL: ${{ secrets.VITE_APP_FIREBASE_DATABASEURL }}
          VITE_APP_FIREBASE_measurementId: ${{ secrets.VITE_APP_FIREBASE_MEASUREMENTID }}
          VITE_APP_FIREBASE_messagingSenderId: ${{ secrets.VITE_APP_FIREBASE_MESSAGINGSENDERID }}
          VITE_APP_FIREBASE_projectId: ${{ secrets.VITE_APP_FIREBASE_PROJECTID }}
          VITE_APP_FIREBASE_storageBucket: ${{ secrets.VITE_APP_FIREBASE_STORAGEBUCKET }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          ClientSecret: ${{ secrets.CLIENTSECRET }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          names = ['VITE_APP_FIREBASE_apiKey','VITE_APP_FIREBASE_appId','VITE_APP_FIREBASE_authDomain','VITE_APP_FIREBASE_databaseURL','VITE_APP_FIREBASE_measurementId','VITE_APP_FIREBASE_messagingSenderId','VITE_APP_FIREBASE_projectId','VITE_APP_FIREBASE_storageBucket','CLIENT_ID','ClientSecret']
          content = ''.join(f'{name}={os.environ.get(name, "")}\n' for name in names)
          Path('.env.production').write_text(content)
          Path('.env.development').write_text(content)
          PY
      - name: Build HS Warpora
        working-directory: Hswarpora
        run: |
          npm ci
          npm run build
      - name: Identify HS Warpora deployment identity
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON_HSWARPORA }}
        run: |
          test -n "$FIREBASE_CREDENTIALS" || { echo '::error::HS Warpora service account secret is missing'; exit 1; }
          printf '%s' "$FIREBASE_CREDENTIALS" | jq -e '.type == "service_account"' >/dev/null
          echo "Service account: $(printf '%s' "$FIREBASE_CREDENTIALS" | jq -r '.client_email')"
          echo "Credential project: $(printf '%s' "$FIREBASE_CREDENTIALS" | jq -r '.project_id')"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON_HSWARPORA }}
      - name: Deploy HS Warpora
        working-directory: Hswarpora
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting:hswarporasopore --project hswarporasopore --non-interactive

