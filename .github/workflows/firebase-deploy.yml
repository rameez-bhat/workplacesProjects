name: Smart Firebase Deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      ceobaramulla: ${{ steps.filter.outputs.ceobaramulla }}
      hswarpora: ${{ steps.filter.outputs.hswarpora }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ceobaramulla:
              - 'ceoAccountsBla/**'
              - '.github/workflows/firebase-deploy.yml'
            hswarpora:
              - 'Hswarpora/**'
              - '.github/workflows/firebase-deploy.yml'

  deploy-ceobaramulla:
    needs: detect-changes
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.ceobaramulla == 'true')
    runs-on: ubuntu-latest
    environment: ceoAccountsBla
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create CEO environment file
        working-directory: ceoAccountsBla
        env:
          VITE_APP_FIREBASE_apiKey: ${{ secrets.VITE_APP_FIREBASE_APIKEY }}
          VITE_APP_FIREBASE_appId: ${{ secrets.VITE_APP_FIREBASE_APPID }}
          VITE_APP_FIREBASE_authDomain: ${{ secrets.VITE_APP_FIREBASE_AUTHDOMAIN }}
          VITE_APP_FIREBASE_databaseURL: ${{ secrets.VITE_APP_FIREBASE_DATABASEURL }}
          VITE_APP_FIREBASE_measurementId: ${{ secrets.VITE_APP_FIREBASE_MEASUREMENTID }}
          VITE_APP_FIREBASE_messagingSenderId: ${{ secrets.VITE_APP_FIREBASE_MESSAGINGSENDERID }}
          VITE_APP_FIREBASE_projectId: ${{ secrets.VITE_APP_FIREBASE_PROJECTID }}
          VITE_APP_FIREBASE_storageBucket: ${{ secrets.VITE_APP_FIREBASE_STORAGEBUCKET }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          ClientSecret: ${{ secrets.CLIENTSECRET }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          names = ['VITE_APP_FIREBASE_apiKey','VITE_APP_FIREBASE_appId','VITE_APP_FIREBASE_authDomain','VITE_APP_FIREBASE_databaseURL','VITE_APP_FIREBASE_measurementId','VITE_APP_FIREBASE_messagingSenderId','VITE_APP_FIREBASE_projectId','VITE_APP_FIREBASE_storageBucket','CLIENT_ID','ClientSecret']
          content = ''.join(f'{name}={os.environ.get(name, "")}\n' for name in names)
          Path('.env.production').write_text(content)
          Path('.env.development').write_text(content)
          PY
      - name: Build CEO Baramulla
        working-directory: ceoAccountsBla
        run: |
          npm ci
          npm run build
      - name: Identify CEO deployment identity
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON_CEOBARAMULLA }}
        run: |
          test -n "$FIREBASE_CREDENTIALS" || { echo '::error::CEO service account secret is missing'; exit 1; }
          printf '%s' "$FIREBASE_CREDENTIALS" | jq -e '.type == "service_account"' >/dev/null
          echo "Service account: $(printf '%s' "$FIREBASE_CREDENTIALS" | jq -r '.client_email')"
          echo "Credential project: $(printf '%s' "$FIREBASE_CREDENTIALS" | jq -r '.project_id')"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON_CEOBARAMULLA }}
      - name: Deploy CEO Baramulla
        working-directory: ceoAccountsBla
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting:ceoaccountsbla --project ceoaccountsbla --non-interactive

  deploy-hswarpora:
    needs: detect-changes
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.hswarpora == 'true')
    runs-on: ubuntu-latest
    environment: Hswarpora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
